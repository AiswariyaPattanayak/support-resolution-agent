<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support Agent Console</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5b6573;--bd:#d9dde3;--ac:#1f6feb;--ok:#1a7f37;--no:#cf222e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--tx:#e6e9ee;--mu:#98a2b3;--bd:#2a313b;--ac:#58a6ff;--ok:#3fb950;--no:#f85149}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 20px;border-bottom:1px solid var(--bd)}h1{margin:0;font-size:18px}small,.mu{color:var(--mu)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:16px 20px;max-width:1300px;margin:auto}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}h2{margin:0 0 10px;font-size:16px}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}
select,input,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button{margin-top:10px;padding:8px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.ok{background:var(--ok)}button.no{background:var(--no)}button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.box{margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--bd)}
.err{color:var(--no)}
</style></head><body>
<header><h1>Support Agent Console</h1><small>Dev tool: synthetic data only. Tokens come from /dev/token (DEV_MODE=1).</small></header>
<main>
<section id="cust"><h2>1. Customer</h2>
<label>Customer</label><select id="who"></select>
<label>Complaint</label><textarea id="msg" rows="3">I returned my headphones last week but still no refund.</textarea>
<button id="send">Send complaint</button> <button id="refreshCase" class="ghost">Refresh my case</button>
<div id="custOut"></div></section>

<section id="rev"><h2>2. Reviewer queue</h2>
<button id="refresh" class="ghost">Refresh</button>
<div id="queue"></div></section>

<section id="ops"><h2>3. Refund operations</h2>
<button id="refreshOps" class="ghost">Refresh</button>
<div id="opsOut"></div></section>

<section id="tl"><h2>4. Timeline &amp; ticket</h2>
<label>Run id</label><input id="runId" placeholder="run_...">
<button id="loadTl" class="ghost">Load timeline</button>
<div id="tlOut"></div></section>
</main>
<script>
const CUSTOMERS=[["cust_eligible","Chitra - eligible refund"],["cust_status","Asha - order status"],["cust_transit","Bala - in transit"],
["cust_rettransit","Dev - return not arrived"],["cust_outside","Esha - outside window"],["cust_processing","Farid - already processing"],
["cust_refunded","Gita - already refunded"],["cust_conflict","Hari - conflicting records"],["cust_damaged","Indu - damaged, no details"],
["cust_damaged_full","Jay - damaged, full details"],["cust_attacker","Leela - tries someone else's order"],
["cust_pol_v1","Mohan - old 30-day policy"],["cust_pol_v2","Nisha - new 15-day policy"]];
const $=id=>document.getElementById(id);
const who=$("who");CUSTOMERS.forEach(([v,t])=>who.add(new Option(t+" ("+v+")",v)));
const tokens={};
async function token(sub,role){const k=sub+role;if(!tokens[k]){const r=await fetch("/dev/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sub,role})});tokens[k]=(await r.json()).token}return tokens[k]}
async function api(path,method,body,sub,role){const t=await token(sub,role);const r=await fetch(path,{method:method||"GET",headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error((data.detail||r.status)+"");return data}
const REV=["reviewer_1","reviewer"];
function el(tag,props,...kids){const e=document.createElement(tag);Object.assign(e,props||{});kids.flat().forEach(k=>e.append(k));return e}
const inr=m=>"\u20B9"+Math.floor(m/100).toLocaleString("en-IN")+"."+String(m%100).padStart(2,"0");
function fail(box,e){box.replaceChildren(el("div",{className:"box err",textContent:"Error: "+e.message}))}

function showRun(out,r,cust){
  const kids=[el("div",{className:"box"},el("span",{className:"tag",textContent:r.status}),el("span",{className:"tag",textContent:r.outcome||"-"}),
    el("div",{textContent:r.reply||(r.pending&&r.pending.question)||(r.status==="waiting_approval"?"Waiting for a reviewer to approve. No money has moved.":"")}),
    el("small",{className:"mu",textContent:"run "+r.run_id+" / ticket "+r.ticket_id}))];
  if(r.status==="waiting_customer"){
    const fields=(r.pending.missing||[]).map(k=>[k,el("input",{placeholder:k})]);
    const b=el("button",{textContent:"Send details",onclick:async()=>{try{const body={};fields.forEach(([k,i])=>{if(i.value)body[k]=i.value});showRun(out,await api("/runs/"+r.run_id+"/messages","POST",body,cust,"customer"),cust)}catch(e){fail(out,e)}}});
    kids.push(...fields.flatMap(([k,i])=>[el("label",{textContent:k}),i]),b)}
  out.replaceChildren(...kids);$("runId").value=r.run_id}

$("send").onclick=async()=>{const out=$("custOut");try{showRun(out,await api("/runs","POST",{message:$("msg").value},who.value,"customer"),who.value);loadQueue();loadOps()}catch(e){fail(out,e)}};

$("refreshCase").onclick=async()=>{const out=$("custOut"),id=$("runId").value.trim();if(!id){fail(out,new Error("No case yet. Send a complaint first."));return}
  try{showRun(out,await api("/runs/"+id,"GET",null,who.value,"customer"),who.value)}catch(e){fail(out,e)}};

async function loadQueue(){const out=$("queue");try{const list=await api("/approvals","GET",null,...REV);
  if(!list.length){out.replaceChildren(el("div",{className:"box mu",textContent:"Nothing waiting for approval."}));return}
  out.replaceChildren(...list.map(a=>{const p=a.proposal,res=el("div");
   const act=(d,notes)=>async()=>{try{const r=await api("/approvals/"+a.approval_id+"/decision","POST",{decision:d,notes:notes||null},...REV);res.replaceChildren(el("div",{className:"box",textContent:d+": "+(r.reply||(r.pending&&r.pending.question)||r.status)}));$("runId").value=r.run_id;loadOps();try{showRun($("custOut"),await api("/runs/"+r.run_id,"GET",null,who.value,"customer"),who.value)}catch(_){}}catch(e){fail(res,e)}};
   return el("div",{className:"box"},el("b",{textContent:"Refund "+inr(p.amount_minor)+" for "+p.order_id+(a.revision?" (revision "+a.revision+")":"")}),
     el("div",{textContent:"Reason: "+p.reason_code}),el("div",{textContent:"Policy: "+(p.policy_refs||[]).join(", ")}),
     el("div",{className:"mu",textContent:"Evidence: "+JSON.stringify(p.evidence||{})}),
     el("div",{className:"mu",textContent:"Expires: "+a.expires_at+" UTC / run "+a.run_id}),
     el("button",{className:"ok",textContent:"Approve",onclick:act("approved")}),document.createTextNode(" "),
     el("button",{className:"no",textContent:"Reject",onclick:act("rejected")}),document.createTextNode(" "),
     el("button",{className:"ghost",textContent:"Request changes",onclick:()=>{const n=prompt("What should the customer clarify?");if(n)act("changes_requested",n)()}}),res)}))}catch(e){fail(out,e)}}
$("refresh").onclick=loadQueue;

async function loadOps(){const out=$("opsOut");try{const ops=await api("/refund-operations","GET",null,...REV);
  const rows=ops.map(o=>el("tr",null,el("td",{textContent:o.order_id}),el("td",{textContent:inr(o.amount_minor)}),el("td",{textContent:o.status}),el("td",{textContent:o.provider_reference||"-"}),
   el("td",null,["reserved","unknown","submitted"].includes(o.status)?el("button",{className:"ghost",textContent:"Sync",onclick:async()=>{try{await api("/refund-operations/"+o.id+"/reconcile","POST",null,...REV);loadOps()}catch(e){fail(out,e)}}}):"")));
  out.replaceChildren(el("table",null,el("tr",null,...["Order","Amount","Status","Provider ref",""].map(h=>el("th",{textContent:h}))),...rows))}catch(e){fail(out,e)}}
$("refreshOps").onclick=loadOps;

$("loadTl").onclick=async()=>{const out=$("tlOut"),id=$("runId").value.trim();try{
  const [ev,run]=await Promise.all([api("/runs/"+id+"/events","GET",null,...REV),api("/runs/"+id,"GET",null,...REV)]);
  const tk=await api("/tickets/"+run.ticket_id,"GET",null,...REV);
  out.replaceChildren(el("div",{className:"box"},el("span",{className:"tag",textContent:"ticket: "+tk.status}),el("div",{textContent:tk.public_note||"(no note yet)"})),
   el("table",null,...ev.map(e=>el("tr",null,el("td",{className:"mu",textContent:e.at.slice(11,19)}),el("td",{textContent:e.actor}),el("td",{textContent:e.event})))))}catch(e){fail(out,e)}};
loadQueue();loadOps();
</script></body></html>
